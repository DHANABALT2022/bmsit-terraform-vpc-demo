name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write lets the job request the GitHub OIDC token for AWS
permissions:
  id-token: write
  contents: read
  pull-requests: write

# Never run two Terraform jobs at the same time
concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_my_ip: ${{ vars.MY_IP }}
  TF_VAR_public_key: ${{ vars.SSH_PUBLIC_KEY }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

     
      - name: Get AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.substring(0, 60000) + '\n... (truncated)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Terraform plan\n```\n' + plan + '\n```'
            });

      - name: Save plan for the apply job
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Waits here for a required reviewer to approve
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Download the reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Apply the reviewed plan
        run: terraform apply -input=false tfplan
